name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per branch or PR; a newer push cancels an older PR run, never a main run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (the tag each SHA had is in the comment);
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      # Runtime packages exactly as Render installs them (hash-checked), then the dev tools.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Validate glossary
        run: python scripts/validate_glossary.py --min-approved 100
        working-directory: .

      - name: Validate content slots
        run: python scripts/validate_content.py
        working-directory: .

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest (pipeline coverage >= 85%)
        run: pytest --cov=app/pipeline --cov-report=term-missing:skip-covered --cov-fail-under=85

      - name: Bandit
        run: bandit -r app -c pyproject.toml

      - name: pip-audit (runtime, every locked package)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip

      - name: pip-audit (dev)
        run: pip-audit -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runtime dependencies gate the build; the build-time tailwindcss 3 advisory is
      # recorded in docs/security/SUPPRESSIONS.md.
      - name: Audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

  content-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate content slots
        run: python scripts/validate_content.py

      - name: Validate dev testset
        run: python -c "import json, sys; [json.loads(l) for l in open('data/testset/dev.jsonl') if l.strip()]; print('✓ dev.jsonl valid')"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits on pull_request events, which needs this.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
